# data-fe 로컬 실행. 백엔드는 data-be 저장소에서 먼저 띄워 두세요.
#
#   docker compose up              개발 서버 (저장하면 바로 반영)  http://localhost:8080
#   docker compose --profile prod up --build web-prod
#                                  서버와 같은 배포 이미지(nginx)로 확인  http://localhost:8081
services:
  web:
    image: node:22.23.5-alpine
    working_dir: /app
    # node_modules가 비어 있거나 package-lock.json이 바뀌었으면 설치하고 개발 서버를 띄운다
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://host.docker.internal:8000}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    ports:
      - "${WEB_HOST_PORT:-8080}:5173"
    # 내 PC에서 실행 중인 백엔드(data-be)를 host.docker.internal로 찾을 수 있게 (리눅스에서도 동작)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      # node_modules는 컨테이너 안에만 둔다 (내 PC 운영체제와 섞이지 않게)
      - node_modules:/app/node_modules

  # 배포 이미지 확인용 (서버와 같은 Dockerfile, nginx). 평소에는 뜨지 않는다.
  web-prod:
    profiles: ["prod"]
    build: .
    environment:
      BACKEND_1: ${BACKEND_1:-host.docker.internal:8000}
      BACKEND_2: ${BACKEND_2:-host.docker.internal:8000}
      NGINX_LISTEN: "80"
    ports:
      - "${WEB_PROD_HOST_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
