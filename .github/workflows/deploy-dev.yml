name: Deploy - dev (on-prem)

# dev에 머지되면: 이미지 빌드(amd64) -> GHCR -> Tailscale로 management 접속 -> frontend 배포 -> 디스코드 알림
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev-fe
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 이미지 안의 nginx 설정이 문법상 맞는지 먼저 확인 (빌드 전)
      - name: Check nginx config
        run: |
          docker run --rm \
            -e BACKEND_1=127.0.0.1:8000 -e BACKEND_2=127.0.0.1:8001 -e NGINX_LISTEN=80 \
            -v "$PWD/nginx/templates:/etc/nginx/templates:ro" \
            nginx:1.27-alpine sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/olympark-data/data-fe:${{ steps.tag.outputs.tag }}
            ghcr.io/olympark-data/data-fe:dev

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 비밀값은 dev 브랜치에서만 쓸 수 있는 Environment에 둔다
    environment: dev-deploy
    permissions:
      contents: read
    steps:
      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via management
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # management의 deploy 계정은 정해진 배포 스크립트만 실행한다 ("fe 태그" 형식만 받음)
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@${DEPLOY_HOST}" "fe ${TAG}"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ needs.deploy.result }}
          TAG: ${{ needs.build.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then STATUS="성공"; else STATUS="실패 ($RESULT)"; fi
          MSG=$(printf '**프론트 dev 배포 %s**\n\n이미지 %s\n%s' "$STATUS" "$TAG" "$RUN_URL")
          jq -n --arg c "$MSG" '{content: $c}' \
            | curl -sS -f -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
